name: Deploy Azure YouTube AI Factory

on:
  workflow_dispatch:
  push:
    branches:
      - main
    paths:
      - .github/workflows/deploy-youtube-ai-factory.yml
      - azure-youtube-factory/deploy-fixed.sh
      - azure-youtube-factory/deploy.sh
      - azure-youtube-factory/configure-agent-env.sh
      - azure-youtube-factory/submit-topic.sh
      - azure-youtube-factory/topic-request.json
      - azure-youtube-factory/worker/**
      - azure-youtube-factory/.deploy-trigger

permissions:
  id-token: write
  contents: read
  issues: write

concurrency:
  group: youtube-ai-factory-deployment
  cancel-in-progress: false

jobs:
  deploy:
    name: Deploy factory
    runs-on: ubuntu-latest
    timeout-minutes: 90

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Sign in to Azure with OIDC
        uses: azure/login@v2
        with:
          client-id: 7575c675-fb43-4cf0-a349-5ae0d6f04914
          tenant-id: b5d8515a-66bc-4232-8dce-fe3788563725
          subscription-id: 46b6491f-e203-4e75-a882-355fbc782320

      - name: Install Container Apps CLI extension
        run: |
          az extension add --name containerapp --upgrade --yes --only-show-errors

      - name: Deploy Azure YouTube AI Factory
        env:
          GITHUB_RUN_NUMBER: ${{ github.run_number }}
          GITHUB_SHA: ${{ github.sha }}
        run: |
          chmod +x azure-youtube-factory/deploy-fixed.sh
          bash azure-youtube-factory/deploy-fixed.sh

      - name: Repair Custom GPT queue configuration
        run: |
          chmod +x azure-youtube-factory/configure-agent-env.sh
          bash azure-youtube-factory/configure-agent-env.sh

      - name: Submit requested YouTube topic
        if: ${{ hashFiles('azure-youtube-factory/topic-request.json') != '' }}
        run: |
          chmod +x azure-youtube-factory/submit-topic.sh
          bash azure-youtube-factory/submit-topic.sh

      - name: Start video job and publish diagnostics
        if: ${{ hashFiles('azure-youtube-factory/topic-request.json') != '' }}
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          set +e
          TARGET_RG="rg-youtube-ai-prod"
          STORAGE_ACCOUNT="stytautocb9288fc"
          JOB_NAME="job-youtube-ai-video"
          CLIENT_ID="7575c675-fb43-4cf0-a349-5ae0d6f04914"
          STORAGE_ID="$(az storage account show -g "$TARGET_RG" -n "$STORAGE_ACCOUNT" --query id -o tsv)"
          PRINCIPAL_ID="$(az ad sp show --id "$CLIENT_ID" --query id -o tsv)"

          for ROLE in "Storage Queue Data Contributor" "Storage Blob Data Reader"; do
            COUNT="$(az role assignment list --assignee-object-id "$PRINCIPAL_ID" --scope "$STORAGE_ID" --query "[?roleDefinitionName=='$ROLE'] | length(@)" -o tsv)"
            if [ "$COUNT" = "0" ]; then
              az role assignment create --assignee-object-id "$PRINCIPAL_ID" --assignee-principal-type ServicePrincipal --role "$ROLE" --scope "$STORAGE_ID" --output none
            fi
          done

          sleep 30
          az containerapp job start -g "$TARGET_RG" -n "$JOB_NAME" --output none

          STATUS="Unknown"
          EXECUTION=""
          for I in $(seq 1 40); do
            EXECUTIONS="$(az containerapp job execution list -g "$TARGET_RG" -n "$JOB_NAME" -o json 2>/dev/null || echo '[]')"
            EXECUTION="$(echo "$EXECUTIONS" | jq -r 'sort_by(.properties.startTime // "") | last | (.name // "")')"
            STATUS="$(echo "$EXECUTIONS" | jq -r 'sort_by(.properties.startTime // "") | last | (.properties.status // "Unknown")')"
            if [ "$STATUS" = "Succeeded" ] || [ "$STATUS" = "Failed" ] || [ "$STATUS" = "Stopped" ]; then
              break
            fi
            sleep 15
          done

          QUEUES="$(az storage queue list --account-name "$STORAGE_ACCOUNT" --auth-mode login --query "[?name=='youtube-topics' || name=='youtube-status' || name=='youtube-deadletter'].{name:name,count:approximateMessageCount}" -o json 2>/dev/null || echo '[]')"
          STATUSES="$(az storage message peek --queue-name youtube-status --account-name "$STORAGE_ACCOUNT" --auth-mode login --num-messages 10 -o json 2>/dev/null || echo '[]')"
          DEADLETTER="$(az storage message peek --queue-name youtube-deadletter --account-name "$STORAGE_ACCOUNT" --auth-mode login --num-messages 5 -o json 2>/dev/null || echo '[]')"
          VIDEO="$(az storage blob list --container-name videos --account-name "$STORAGE_ACCOUNT" --auth-mode login --query "sort_by(@,&properties.lastModified)[-1].{name:name,modified:properties.lastModified,size:properties.contentLength}" -o json 2>/dev/null || echo 'null')"
          OAUTH="$(az keyvault secret list --vault-name kv-ytauto-cb9288fc --query "[?name=='youtube-client-secret-json' || name=='youtube-token-json'].{name:name,enabled:attributes.enabled}" -o json 2>/dev/null || echo '[]')"

          cat > /tmp/youtube-diagnostic.md <<EOF
          # YouTube Video Test Diagnostic

          - GitHub run: ${GITHUB_RUN_ID}
          - Container Apps execution: ${EXECUTION:-not-found}
          - Execution status: ${STATUS}

          ## OAuth secrets
          \`\`\`json
          ${OAUTH}
          \`\`\`

          ## Queue counts
          \`\`\`json
          ${QUEUES}
          \`\`\`

          ## Status messages
          \`\`\`json
          ${STATUSES}
          \`\`\`

          ## Dead-letter messages
          \`\`\`json
          ${DEADLETTER}
          \`\`\`

          ## Latest video blob
          \`\`\`json
          ${VIDEO}
          \`\`\`
          EOF

          gh issue create --repo "$GITHUB_REPOSITORY" --title "YouTube Video Test Diagnostic ${GITHUB_RUN_ID}" --body-file /tmp/youtube-diagnostic.md

      - name: Write deployment summary
        if: always()
        run: |
          echo "## Azure YouTube AI Factory" >> "$GITHUB_STEP_SUMMARY"
          if [ -f deployment-summary.md ]; then
            cat deployment-summary.md >> "$GITHUB_STEP_SUMMARY"
          else
            echo "Deployment did not produce a summary. Review the workflow log." >> "$GITHUB_STEP_SUMMARY"
          fi
          if [ -f azure-youtube-factory/topic-request.json ]; then
            echo "" >> "$GITHUB_STEP_SUMMARY"
            echo "## Requested video" >> "$GITHUB_STEP_SUMMARY"
            cat azure-youtube-factory/topic-request.json >> "$GITHUB_STEP_SUMMARY"
          fi
